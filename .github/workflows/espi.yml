name: ESPI Monitor (chmura)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprawdź feed i wyślij nowe komunikaty
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 espi_cloud.py
      - name: Zapisz stan (seen_cloud.json)
        run: |
          git config user.name "espi-bot"
          git config user.email "espi-bot@users.noreply.github.com"
          git add seen_cloud.json
          git diff --cached --quiet || git commit -m "stan"
          git push
